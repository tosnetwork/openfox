services:
  # ─────────────────────────────────────────────
  # OpenFox Agent (one-shot query) - Full MCP Support
  #   docker compose -f docker/docker-compose.full.yml run --rm openfox-agent -m "Hello"
  # ─────────────────────────────────────────────
  openfox-agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile.full
    container_name: openfox-agent-full
    profiles:
      - agent
    volumes:
      - ../config/config.json:/root/.openfox/config.json:ro
      - openfox-workspace:/root/.openfox/workspace
      - openfox-npm-cache:/root/.npm # npm cache for faster MCP server installs
    entrypoint: ["openfox", "agent"]
    stdin_open: true
    tty: true

  # ─────────────────────────────────────────────
  # OpenFox Gateway (Long-running Bot) - Full MCP Support
  #   docker compose -f docker/docker-compose.full.yml --profile gateway up
  # ─────────────────────────────────────────────
  openfox-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.full
    container_name: openfox-gateway-full
    restart: unless-stopped
    profiles:
      - gateway
    volumes:
      # Configuration file
      - ../config/config.json:/root/.openfox/config.json:ro
      # Persistent workspace (sessions, memory, logs)
      - openfox-workspace:/root/.openfox/workspace
      # NPM cache for faster MCP server installs
      - openfox-npm-cache:/root/.npm
    command: ["gateway"]

volumes:
  openfox-workspace:
  openfox-npm-cache: # Cache npm packages to speed up MCP server installations

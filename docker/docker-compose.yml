services:
  # ─────────────────────────────────────────────
  # OpenFox Agent (one-shot query)
  #   docker compose -f docker/docker-compose.yml run --rm openfox-agent -m "Hello"
  # ─────────────────────────────────────────────
  openfox-agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: docker.io/tosnetwork/openfox:latest
    container_name: openfox-agent
    profiles:
      - agent
    # Uncomment to access host network; leave commented unless needed.
    #extra_hosts:
    #  - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/root/.openfox
    entrypoint: ["openfox", "agent"]
    stdin_open: true
    tty: true

  # ─────────────────────────────────────────────
  # OpenFox Gateway (Long-running Bot)
  #   docker compose -f docker/docker-compose.yml --profile gateway up
  # ─────────────────────────────────────────────
  openfox-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: docker.io/tosnetwork/openfox:latest
    container_name: openfox-gateway
    restart: unless-stopped
    profiles:
      - gateway
    # Uncomment to access host network; leave commented unless needed.
    #extra_hosts:
    #  - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/root/.openfox

  # ─────────────────────────────────────────────
  # OpenFox Launcher (Web Console + Gateway)
  #   docker compose -f docker/docker-compose.yml --profile launcher up
  # ─────────────────────────────────────────────
  openfox-launcher:
    build:
      context: ..
      dockerfile: docker/Dockerfile.launcher
    image: docker.io/tosnetwork/openfox:launcher
    container_name: openfox-launcher
    restart: unless-stopped
    profiles:
      - launcher
    environment:
      - OPENFOX_GATEWAY_HOST=0.0.0.0
      # Set a fixed dashboard token instead of a random one each restart.
      # If not set, a random token is generated and printed to the console on startup.
      #- OPENFOX_LAUNCHER_TOKEN=your-secret-token-here
    ports:
      - "18800:18800"
      - "18790:18790"
    volumes:
      - ./data:/root/.openfox

name: PR

on:
  pull_request: { }

jobs:
  lint:
    name: Linter
    runs-on: ubuntu-latest
    steps:
      # Full history so golangci-lint can find the merge base itself.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run go generate
        run: go generate -tags goolm,stdjson ./...

      - name: Verify mandatory Matrix build tags
        run: make check-build-tags

      - name: Golangci Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.1
          # The action's only-new-issues mode fetches the PR patch through the
          # API, which refuses diffs over 20,000 lines and then silently lints
          # the whole tree. Compare against the merge base locally instead.
          args: --build-tags=goolm,stdjson --new-from-merge-base=origin/${{ github.base_ref }}

  vuln_check:
    name: Security Check
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -tags=goolm,stdjson
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Run Govulncheck
        run: govulncheck -C . -format text ./...

  test:
    name: Tests
    runs-on: ubuntu-latest
    env:
      # The tosctl build that signs and verifies ML-DSA-44 for the owner
      # Action Authority, the custody authorization and the rail packets.
      # Those tests fail, rather than skip, without it.
      TOS_HELPER_REPOSITORY: tosnetwork/tos
      TOS_HELPER_COMMIT: c41331dd3103c0eac719d7e5f368079f0a40e64f
    steps:
      # The two checkouts are siblings so `./...` never walks the helper's
      # source tree.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: openfox

      - name: Check out the pinned tosctl helper source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.TOS_HELPER_REPOSITORY }}
          ref: ${{ env.TOS_HELPER_COMMIT }}
          path: tos
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tos/tosctl/src -> target
          key: tosctl-${{ env.TOS_HELPER_COMMIT }}

      - name: Build the tosctl helper
        working-directory: tos/tosctl/src
        run: cargo build -p tosctl --bin tosctl --locked

      - name: Pin the tosctl helper for the tests
        run: |
          helper="$GITHUB_WORKSPACE/tos/tosctl/src/target/debug/tosctl"
          chmod 0755 "$helper"
          echo "TOS_SERVICE_TOSCTL=$helper" >> "$GITHUB_ENV"
          echo "TOS_SERVICE_TOSCTL_SHA256=$(sha256sum "$helper" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: openfox/go.mod
          cache-dependency-path: openfox/go.sum

      - name: Run go generate
        working-directory: openfox
        run: go generate -tags goolm,stdjson ./...

      # The isolation tests exercise a real bubblewrap sandbox: some only open
      # the launcher pinned at /usr/bin/bwrap, others actually execute a hook
      # inside the sandbox. They fail closed rather than skip, since they guard
      # a security invariant. Install bubblewrap, and lift the AppArmor
      # restriction on unprivileged user namespaces that ubuntu-24.04 runners
      # enable by default, without which bwrap cannot create the sandbox.
      - name: Install bubblewrap and enable unprivileged user namespaces
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # pkg/earning holds the post-quantum Guarantor end-to-end test, which
      # signs every authorization through the helper; on a small runner the
      # package can approach the default 10 minute limit.
      - name: Run go test
        working-directory: openfox
        run: go test -timeout 30m -tags goolm,stdjson ./...

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Docker-backed integration suites
        run: bash ./scripts/run-integration-tests.sh
